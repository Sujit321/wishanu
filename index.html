<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fff4e8">
    <title>Happy Birthday!</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        color: #38264a;
        background: #fff4e8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background:
          radial-gradient(ellipse at 10% 15%, #ffe1d4 0, transparent 35%),
          radial-gradient(ellipse at 90% 85%, #e8dcff 0, transparent 38%),
          #fff4e8;
      }

      main {
        position: relative;
        width: min(100%, 38rem);
        padding: clamp(2.5rem, 8vw, 5rem) clamp(1.5rem, 7vw, 4rem);
        overflow: hidden;
        text-align: center;
        background: rgb(255 255 255 / 88%);
        border: 1px solid rgb(255 255 255 / 90%);
        border-radius: 2rem;
        box-shadow: 0 1.5rem 5rem rgb(74 42 89 / 12%);
      }

      .sparkle {
        position: absolute;
        color: #e6a637;
        font-size: 1.5rem;
        animation: twinkle 2.5s ease-in-out infinite alternate;
      }

      .sparkle:first-child {
        top: 1.5rem;
        left: 1.75rem;
      }

      .sparkle:nth-child(2) {
        top: 2.5rem;
        right: 2rem;
        color: #df718b;
        animation-delay: 0.8s;
      }

      .sparkle:nth-child(3) {
        right: 1.5rem;
        bottom: 1.75rem;
        color: #8299d2;
        animation-delay: 1.3s;
      }

      .cake {
        display: block;
        margin-bottom: 1.25rem;
        font-size: clamp(3.5rem, 12vw, 5rem);
        line-height: 1;
      }

      h1 {
        margin: 0;
        color: #75489a;
        font-family: Georgia, serif;
        font-size: clamp(2.75rem, 10vw, 4.5rem);
        line-height: 1.05;
      }

      p {
        max-width: 28rem;
        margin: 1.25rem auto 0;
        font-size: clamp(1rem, 3.5vw, 1.2rem);
        line-height: 1.75;
      }

      .signoff {
        margin-top: 1.75rem;
        color: #a45b78;
        font-family: Georgia, serif;
        font-size: 1.25rem;
        font-style: italic;
      }

      @keyframes twinkle {
        from { transform: scale(0.8) rotate(-12deg); opacity: 0.6; }
        to { transform: scale(1.15) rotate(12deg); opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="sparkle" aria-hidden="true">✦</span>
      <span class="sparkle" aria-hidden="true">✧</span>
      <span class="sparkle" aria-hidden="true">✦</span>
      <span class="cake" role="img" aria-label="Birthday cake">🎂</span>
      <h1>Happy Birthday!</h1>
      <p>
        May your day be filled with laughter, lovely surprises, and all the
        little things that make you smile. Wishing you a wonderful year ahead!
      </p>
      <p class="signoff">Have the happiest day ✨</p>
    </main>
  </body>
</html>
